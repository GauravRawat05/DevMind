name: DevMind CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Testing
  test-backend:
    runs-on: ubuntu-latest
    
    # Database services for running integrations tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devmind_user
          POSTGRES_PASSWORD: devmind_password
          POSTGRES_DB: devmind_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:6-jammy
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Backend Integration & Unit Tests
      env:
        DATABASE_URL: postgresql+asyncpg://devmind_user:devmind_password@localhost:5432/devmind_db
        REDIS_URL: redis://localhost:6379/0
        MONGODB_URL: mongodb://localhost:27017/devmind_db
        GROQ_API_KEY: mock_api_key_for_testing
        HUGGINGFACE_API_KEY: mock_api_key_for_testing
        GITHUB_TOKEN: mock_token_for_testing
        JWT_SECRET: testing_jwt_secret_key_long_enough_32_bytes_xyz
        AWS_S3_BUCKET: devmind-testing-bucket
        CHROMADB_PATH: ./chroma_db_test
      run: |
        python -m pytest backend/tests/ -v

  # 2. Frontend Build Verification
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Next.js Application
      run: |
        cd frontend
        npm run build

  # 3. Docker Image Build Verification
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.backend
        push: false
        tags: devmind-backend:latest

    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.frontend
        push: false
        tags: devmind-frontend:latest
